<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor de Contexto Situacional · Venezuela 2026 · PNUD</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇻🇪</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html[data-theme="dark"] body { background: #0b1220; }
    body { background: #f4f6f9; font-family: 'DM Sans', sans-serif; }
    button, input, select, textarea { font: inherit; }
  </style>
  <script>
    // Applied before React mounts so the very first paint already matches
    // the saved theme instead of flashing the other one. Light is always
    // the default until the user explicitly picks dark.
    (function () {
      try {
        var stored = window.localStorage.getItem("pnud-monitor-theme");
        var theme = (stored === "light" || stored === "dark") ? stored : "light";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
